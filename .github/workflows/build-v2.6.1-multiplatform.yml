name: Build v2.6.1 multi-platform

on:
  push:
    branches:
      - build/v2.6.1-multiplatform
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: v2.6.1-multiplatform-${{ github.repository }}
  cancel-in-progress: false

env:
  SOURCE_TAG: v2.6.1

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    container:
      image: goreleaser/goreleaser-cross:v1.26
    steps:
      - name: Trust workspace directories
        run: git config --global --add safe.directory '*'

      - name: Checkout build configuration
        uses: actions/checkout@v7.0.1
        with:
          path: .ci
          sparse-checkout: .github/multiplatform-v2.6.1.goreleaser.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout v2.6.1 source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_TAG }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          apt update
          apt install unzip curl zip make -y
          curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/bin/yq
          chmod +x /usr/bin/yq

      - name: Prepare frontend distributions
        working-directory: source
        run: |
          chmod +x ./script/fetch-frontends.sh
          ./script/fetch-frontends.sh

      - name: Refresh IPInfo GeoIP database when configured
        working-directory: source
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          if [ -n "$IPINFO_TOKEN" ]; then
            curl -fsSL "https://ipinfo.io/data/free/country.mmdb?token=${IPINFO_TOKEN}" -o pkg/geoip/geoip.db
          else
            echo "IPINFO_TOKEN is not configured; using the database bundled with v2.6.1."
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "^1.26.6"
          cache: false

      - name: Generate Swagger docs
        working-directory: source
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          swag init --pd -d cmd/dashboard -g main.go -o cmd/dashboard/docs
          go mod tidy

      - name: Build zstd for Windows arm64
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        working-directory: source
        run: |
          go mod vendor
          git clone --depth 1 --branch v1.5.7 https://github.com/facebook/zstd /tmp/zstd
          make -C /tmp/zstd/lib clean libzstd.a \
            CC=/llvm-mingw/bin/aarch64-w64-mingw32-gcc \
            CXX=/llvm-mingw/bin/aarch64-w64-mingw32-g++ \
            AR=/llvm-mingw/bin/aarch64-w64-mingw32-ar \
            ZSTD_LEGACY_SUPPORT=0
          GOZSTD_VENDOR="$GITHUB_WORKSPACE/source/vendor/github.com/valyala/gozstd"
          cp /tmp/zstd/lib/libzstd.a "$GOZSTD_VENDOR/libzstd_windows_arm64.a"
          printf '//go:build windows && arm64\n\npackage gozstd\n\n/*\n#cgo LDFLAGS: ${SRCDIR}/libzstd_windows_arm64.a\n*/\nimport "C"\n' > "$GOZSTD_VENDOR/libzstd_windows_arm64.go"

      - name: Build target
        uses: goreleaser/goreleaser-action@v7
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        with:
          distribution: goreleaser
          version: "~> v2"
          workdir: source
          args: build --config ../.ci/.github/multiplatform-v2.6.1.goreleaser.yml --single-target --clean --skip=validate --snapshot

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-${{ matrix.goos }}-${{ matrix.goarch }}
          path: source/dist/*/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish v2.6.1 platform archives
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets

      - name: Create platform archives
        run: |
          find assets -type f -name 'dashboard-*' -print0 | while IFS= read -r -d '' file; do
            archive="${file%.exe}.zip"
            zip -j "$archive" "$file"
          done

      - name: Publish release archives
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.6.1
          name: v2.6.1
          files: assets/**/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

  linux-docker:
    name: Publish Linux amd64/arm64 images
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2.6.1 source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_TAG }}
          path: source
          persist-credentials: false

      - name: Download Linux build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dashboard-linux-*
          path: assets

      - name: Prepare Linux Docker build context
        run: |
          mkdir -p source/dist
          find assets -type f \( -name 'dashboard-linux-amd64' -o -name 'dashboard-linux-arm64' \) -exec cp {} source/dist/ \;
          chmod +x source/dist/dashboard-linux-*
          test -x source/dist/dashboard-linux-amd64
          test -x source/dist/dashboard-linux-arm64

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Linux images
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: ghcr.io/wiuee/nezha:v2.6.1-linux

      - name: Verify Linux architectures and version
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:v2.6.1-linux"
          for ARCH in amd64 arm64; do
            VERSION="$(docker run --rm --platform "linux/$ARCH" --entrypoint /dashboard/app "$IMAGE" -v)"
            if [[ "$VERSION" != "2.6.1" ]]; then
              echo "::error::linux/$ARCH returned version $VERSION instead of 2.6.1"
              exit 1
            fi
            echo "linux/$ARCH version: $VERSION"
          done

  windows-docker:
    name: Publish Windows ${{ matrix.arch }} image
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2022
            base: mcr.microsoft.com/windows/servercore:ltsc2022
          - arch: arm64
            runner: windows-11-arm
            base: mcr.microsoft.com/windows/servercore:ltsc2025-arm64
    env:
      MATRIX_ARCH: ${{ matrix.arch }}
      WINDOWS_BASE: ${{ matrix.base }}
    steps:
      - name: Checkout Windows Dockerfile
        uses: actions/checkout@v7.0.1
        with:
          path: .ci
          sparse-checkout: Dockerfile.windows
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout v2.6.1 source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_TAG }}
          path: source
          persist-credentials: false

      - name: Download Windows build artifact
        uses: actions/download-artifact@v8
        with:
          pattern: dashboard-windows-*
          path: assets

      - name: Prepare Windows Docker build context
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path source\dist | Out-Null
          $binary = Get-ChildItem -Path assets -Recurse -File -Filter "dashboard-windows-$env:MATRIX_ARCH.exe" | Select-Object -First 1
          if ($null -eq $binary) { throw "Missing dashboard-windows-$env:MATRIX_ARCH.exe" }
          Copy-Item $binary.FullName "source\dist\dashboard-windows-$env:MATRIX_ARCH.exe"
          Copy-Item .ci\Dockerfile.windows source\Dockerfile.windows

      - name: Set up Docker for Windows ARM64
        if: matrix.arch == 'arm64'
        uses: ndabas/setup-moby-windows-arm64@e9755ab43b45a2a3ed50acb8b8ac57af753588db
        with:
          version: docker-v29.9.3
          skip-if-present: "false"

      - name: Check Docker engine
        shell: pwsh
        run: |
          docker version
          if ($LASTEXITCODE -ne 0) { throw "Docker engine is not ready" }

      - name: Log in to GHCR
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:GH_TOKEN | docker login ghcr.io --username "${{ github.repository_owner }}" --password-stdin
          if ($LASTEXITCODE -ne 0) { throw "GHCR login failed" }

      - name: Build Windows image
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repository = "ghcr.io/$($env:GITHUB_REPOSITORY.ToLower())"
          $image = "${repository}:v2.6.1-windows-$env:MATRIX_ARCH"
          $arguments = @(
            'build', '--file', 'Dockerfile.windows',
            '--build-arg', "TARGETARCH=$env:MATRIX_ARCH",
            '--build-arg', "WINDOWS_BASE=$env:WINDOWS_BASE",
            '--tag', $image, '.'
          )
          & docker @arguments
          if ($LASTEXITCODE -ne 0) { throw "docker build failed with exit code $LASTEXITCODE" }
          $actual = & docker image inspect $image --format '{{.Os}}/{{.Architecture}}'
          if ($actual -ne "windows/$env:MATRIX_ARCH") {
            throw "Expected windows/$env:MATRIX_ARCH, got $actual"
          }
          "IMAGE=$image" >> $env:GITHUB_ENV

      - name: Verify Windows executable and version
        shell: pwsh
        run: |
          $version = (& docker run --rm $env:IMAGE -v | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Windows dashboard failed to start" }
          if ($version -ne '2.6.1') { throw "Expected version 2.6.1, got $version" }
          Write-Host "windows/$env:MATRIX_ARCH version: $version"

      - name: Push verified Windows image
        shell: pwsh
        run: |
          docker push $env:IMAGE
          if ($LASTEXITCODE -ne 0) { throw "docker push failed for $env:IMAGE" }

  manifest:
    name: Merge and verify four-platform Docker manifest
    needs: [linux-docker, windows-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Publish and verify v2.6.1 manifest
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SOURCES=(
            "$IMAGE:v2.6.1-linux"
            "$IMAGE:v2.6.1-windows-amd64"
            "$IMAGE:v2.6.1-windows-arm64"
          )
          docker buildx imagetools create -t "$IMAGE:v2.6.1" "${SOURCES[@]}"
          docker buildx imagetools inspect "$IMAGE:v2.6.1" | tee manifest.txt
          for PLATFORM in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            grep -Eq "Platform:[[:space:]]+$PLATFORM([[:space:]]|$)" manifest.txt \
              || { echo "::error::$IMAGE:v2.6.1 is missing $PLATFORM"; exit 1; }
          done
